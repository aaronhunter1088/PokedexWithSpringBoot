spring.application.name=Pokedex
spring.application.version=1.10.2

skaro.pokeapi.baseUri=https://mypokedex.us/springboot/
skaro.pokeapi.maxBytesToBuffer=5065000

spring.web.resources.static-locations=classpath:/images/,classpath:/resources/
spring.web.resources.cache.period=0
server.servlet.context-path=/
server.servlet.session.tracking-modes=cookie
spring.profiles.active=production
spring.devtools.restart.enabled=false

spring.mvc.view.prefix=/WEB-INF/jsp/
spring.mvc.view.suffix=.jsp

# Disable pointless JAR scanning noise
#server.tomcat.additional-tld-skip-patterns=*.jar
# Skip known non-TLD jars only
server.tomcat.additional-tld-skip-patterns=\
spring-*.jar,\
log4j-*.jar,\
jackson-*.jar,\
slf4j-*.jar,\
hibernate-*.jar

# OpenAPI documentation
springdoc.api-docs.path=/v3/api-docs
springdoc.api-docs.enabled=true

# Swagger UI
springdoc.swagger-ui.enabled=true
springdoc.swagger-ui.url=/springboot/v3/api-docs
springdoc.swagger-ui.disable-swagger-default-url=true

# Sorting
springdoc.swagger-ui.operationsSorter=method
springdoc.swagger-ui.tagsSorter=alpha

# Display
springdoc.swagger-ui.showExtensions=true
springdoc.swagger-ui.displayRequestDuration=true

# Start War Locally in Production Mode
#java -jar Pokedex-version-boot.war --spring.profiles.active=production --server.port=8101 --server.servlet.context-path=/springboot
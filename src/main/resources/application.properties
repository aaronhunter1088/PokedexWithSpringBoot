spring.application.name=Pokedex
spring.application.version=1.6.5

skaro.pokeapi.baseUri=https://pokeapi.co/api/v2/
skaro.pokeapi.maxBytesToBuffer=5065000

spring.web.resources.static-locations=classpath:/images/,classpath:/resources/
spring.web.resources.cache.period=0
#server.port=4201
server.servlet.context-path=/
server.servlet.session.tracking-modes=cookie
spring.profiles.active=production
spring.devtools.restart.enabled=false

spring.mvc.view.prefix=/WEB-INF/jsp/
spring.mvc.view.suffix=.jsp

# Disable pointless JAR scanning noise
#server.tomcat.additional-tld-skip-patterns=*.jar
# Skip known non-TLD jars only
server.tomcat.additional-tld-skip-patterns=\
spring-*.jar,\
log4j-*.jar,\
jackson-*.jar,\
slf4j-*.jar,\
hibernate-*.jar

# Springdocs Swagger/OpenAPI configuration
springdoc.api-docs.enabled=false
springdoc.swagger-ui.enabled=false

# http://<HOST>/<CONTEXT-PATH>/swagger-ui/index.html
# http://localhost:4204/springboot/swagger-ui/index.html
# http://localhost:4204/springboot/v3/api-docs

# Logging configuration found in log4j2.properties


# The PokeAPI client requests PokeAPI-shaped paths (e.g. /evolution-chain/1), which the standalone PokedexApi
# does not serve (it exposes /evolution/evolution-chain/1), so always use PokeAPI directly.
skaro.pokeapi.baseUri=https://pokeapi.co/api/v2/
#skaro.pokeapi.maxBytesToBuffer=5065000

pokedexapi.openapi.server-url=http://localhost:4204/pokedexapi
springdoc.swagger-ui.url=/springboot/v3/api-docs
server.port=4201
server.servlet.context-path=/springboot


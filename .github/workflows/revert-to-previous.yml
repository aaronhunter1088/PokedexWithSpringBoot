# separate terms of service, privacy policy, and support
# documentation.
# This workflow will revert the war from the backup if there
# happens to be something wrong with the deployment of the
# latest version. 
# For more information see: https://github.com/actions/setup-java/blob/main/docs/advanced-usage.md#Publishing-using-gradle

name: Revert To Previous Pokédex Spring Boot Version

on:
  workflow_dispatch:

jobs:
  revert-to-previous:
    runs-on: ubuntu-latest

    steps:
      - name: Test SSH Connection
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            echo 'whoami' 
            whoami
            echo 'hostname'
            hostname
            echo 'java -version'
            java -version

      - name: Revert to Previous Pokédex Spring Boot Version
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            # Stop script on a failing command rather than blindly continuing
            set -e

            # Stop Tomcat 11 Service
            sudo systemctl stop tomcat11

            # Revert to Previous Working Version
            sudo rm -rf /opt/tomcat11/MyPokedex/springboot
            sudo rm -rf /opt/tomcat11/MyPokedex/springboot.war
            sudo cp -a /opt/tomcat11/MyPokedexBackup/springboot.war \
                       /opt/tomcat11/MyPokedex/springboot.war

            # Update Ownership
            sudo chown tomcat:tomcat /opt/tomcat11/MyPokedex/springboot.war
            sudo chown -R tomcat:tomcat /opt/tomcat11/MyPokedexBackup/springboot.war
            sudo chmod 755 /opt/tomcat11/MyPokedex/springboot.war

            # Start Tomcat 11 Service
            sudo systemctl start tomcat11

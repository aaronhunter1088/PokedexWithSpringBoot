# They are provided by a third-party and are governed by
# separate terms of service, privacy policy, and support
# documentation.
# This workflow will check out the code, set up Java, build
# the code, and upload to the temporary directory.
# For more information see: https://github.com/actions/setup-java/blob/main/docs/advanced-usage.md#Publishing-using-gradle

name: Deploy Pokédex Spring Boot

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to deploy'
        required: true
        type: string

jobs:
  deploy: 
    runs-on: ubuntu-latest

    steps:
      - name: Set up Java
        uses: actions/setup-java@v5.7.0
        with:
          distribution: temurin
          java-version: '25'

      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Checkout Parent
        uses: actions/checkout@v4
        with:
          repository: aaronhunter1088/parent
          path: parent
          token: ${{ secrets.PARENT_REPO_TOKEN }}

      - name: Checkout Pokeapi-reactor
        uses: actions/checkout@v4
        with:
          repository: aaronhunter1088/pokeapi-reactor
          path: reactor
          token: ${{ secrets.REACTOR_REPO_TOKEN }}

      - name: Checkout PokedexApi
        uses: actions/checkout@v4
        with:
          repository: aaronhunter1088/PokedexApi
          path: pokedexapi
          token: ${{ secrets.POKEDEXAPI_REPO_TOKEN }}

      - name: Install Parent
        run: mvn -f parent/pom.xml install -DskipTests

      - name: Install Pokeapi-reactor
        run: mvn -f reactor/pom.xml install -DskipTests

      - name: Install Pokedex-api
        run: mvn -f pokedexapi/pom.xml install -DskipTests
        
      - name: Build Pokédex WAR
        run: mvn clean package

      - name: Upload Pokédex WAR
        uses: appleboy/scp-action@v1
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          source: "dist/${{ inputs.version }}/Pokedex-${{ inputs.version }}-boot.war"
          target: "/tmp/deploy"

      - name: Copy Previous Working Version, Deploy new WAR
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            # Stop script on a failing command rather than blindly continuing
            set -e

            # Verify new JAR exists before touching production
            test -n "$(find /tmp/deploy/dist/${{ inputs.version }}/ -type f -name 'Pokedex-*-boot.war' -print -quit)"
            
            # Stop Tomcat 11 Service
            sudo systemctl stop tomcat11

            # Copy Previous Working Version
            sudo cp -a /opt/tomcat11/MyPokedex/springboot/. /opt/tomcat11/MyPokedexBackup/springboot/
            sudo rm -rf /opt/tomcat11/MyPokedexBackup/springboot
            sudo rm -rf /opt/tomcat11/MyPokedexBackup/springboot.war
            sudo mkdir -p /opt/tomcat11/MyPokedexBackup/springboot

            # Prepare New Version
            sudo rm -rf /opt/tomcat11/MyPokedex/springboot 
            sudo mv /tmp/deploy/dist/${{ inputs.version }}/Pokedex-${{ inputs.version }}-boot.war \
                    /opt/tomcat11/MyPokedex/springboot.war

            # Update Ownership
            sudo chown -R tomcat:tomcat /opt/tomcat11/MyPokedex/*
            #sudo chown -R tomcat:tomcat /opt/tomcat11/MyPokedexBackup/*
            sudo chmod 755 /opt/tomcat11/MyPokedex/springboot.war

            # Start Tomcat 11 Service
            sudo systemctl start tomcat11

            # Wait for Tomcat service
            # Wait for Spring Boot WAR to explode
            sleep 120
            
            # Show recent logs
            sudo journalctl -u tomcat11 -n 100 --no-pager

      - name: Build Pokédex OpenApi
        run: mvn springdoc-openapi:generate

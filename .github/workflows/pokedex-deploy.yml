# separate terms of service, privacy policy, and support
# documentation.
# This workflow will check out the code, set up Java, build
# the code, and upload to the temporary directory.
# For more information see: https://github.com/actions/setup-java/blob/main/docs/advanced-usage.md#Publishing-using-gradle

name: Deploy Pokédex Spring Boot

on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v5.7.0
        with:
          distribution: temurin
          java-version: '25'

      - name: Build Pokédex WAR
        run: ./mvnw clean package
        
      - name: Upload Pokédex WAR
        uses: appleboy/scp-action@v1
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          source: "build/libs/Pokedex-*-boot.war"
          target: "/tmp/deploy"

      - name: Copy Previous Working Version, Deploy Plain WAR
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            # Stop script on a failing command rather than blindly continuing
            set -e
            # Stop Tomcat 11 Service
            sudo systemctl stop tomcat11

            # Copy Previous Working Version
            cd /opt/tomcat11
            sudo rm -rf MyPokedexBackup/springboot
            sudo rm -rf MyPokedexBackup/springboot.war
            sudo mkdir -p MyPokedexBackup/springboot
            sudo cp -a MyPokedex/springboot/. MyPokedexBackup/springboot/

            # Prepare New Version
            sudo rm -rf Mixology 
            sudo mkdir Mixology
            sudo mv /tmp/deploy/build/libs/Pokedex-*-boot.war /opt/tomcat11/Pokedex/springboot.war

            # Update Ownership
            sudo chown -R tomcat:tomcat /opt/tomcat11/MyPokedex/springboot
            sudo chown -R tomcat:tomcat /opt/tomcat11/MyPokedexBackup/springboot

            # Update Permissions
            sudo find /opt/tomcat11/MyPokedex/springboot -type d -exec chmod 755 {} \;
            sudo find /opt/tomcat11/MyPokedex/springboot -type f -exec chmod 644 {} \;

            # Start Tomcat 11 Service
            sudo systemctl start tomcat11
            timeout 120 bash -c 'until sudo systemctl is-active --quiet tomcat11; do sleep 3; done'
            sudo journalctl -u tomcat11 -n 100 --no-pager

            # Generate new Swagger
            cd /opt/tomcat11/MyPokedex/springboot
            sudo ./mvnw springdoc-openapi:generate

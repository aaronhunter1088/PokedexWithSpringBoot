# separate terms of service, privacy policy, and support
# documentation.
# This workflow will check out the code, set up Java, build
# the code, and upload to the temporary directory.
# For more information see: https://github.com/actions/setup-java/blob/main/docs/advanced-usage.md#Publishing-using-gradle

name: Deploy Pokédex Spring Boot

on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Set up Java
        uses: actions/setup-java@v5.7.0
        with:
          distribution: temurin
          java-version: '25'
          
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Checkout Parent
        uses: actions/checkout@v4
        with:
          repository: aaronhunter1088/parent
          path: parent
          token: ${{ secrets.PARENT_REPO_TOKEN }}

      - name: Checkout pokeapi-reactor
        uses: actions/checkout@v4
        with:
          repository: aaronhunter1088/pokeapi-reactor
          path: reactor
          token: ${{ secrets.REACTOR_REPO_TOKEN }}

      - name: Checkout PokedexApi
        uses: actions/checkout@v4
        with:
          repository: aaronhunter1088/PokedexApi
          path: pokedexapi
          token: ${{ secrets.POKEDEXAPI_REPO_TOKEN }}

      - name: Install Parent POM
        run: mvn -f parent/pom.xml install -DskipTests

      - name: Install pokeapi-reactor
        run: mvn -f reactor/pom.xml install -DskipTests

      - name: Install pokedex-api
        run: mvn -f pokedexapi/pom.xml install -DskipTests
        
      - name: Build Pokédex WAR
        run: mvn clean package
        
      - name: Upload Pokédex WAR
        uses: appleboy/scp-action@v1
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          source: "dist/1.6.2/Pokedex-1.6.2-boot.war"
          target: "/tmp/deploy"

      - name: Copy Previous Working Version, Deploy Plain WAR
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            # Stop script on a failing command rather than blindly continuing
            set -e

            # Verify new JAR exists before touching production
            test -n "$(find /tmp/deploy/dist -type f -name 'Pokedex-*-boot.war' -print -quit)"
            
            # Stop Tomcat 11 Service
            sudo systemctl stop tomcat11

            # Copy Previous Working Version
            cd /opt/tomcat11
            sudo rm -rf MyPokedexBackup/springboot
            sudo rm -rf MyPokedexBackup/springboot.war
            sudo mkdir -p MyPokedexBackup/springboot
            sudo cp -a MyPokedex/springboot/. MyPokedexBackup/springboot/

            # Prepare New Version
            sudo rm -rf MyPokedex/springboot 
            sudo mv /tmp/deploy/1.6.2/Pokedex-1.6.2-boot.war /opt/tomcat11/Pokedex/springboot.war

            # Update Ownership
            sudo chown -R tomcat:tomcat /opt/tomcat11/MyPokedex/springboot/*
            sudo chown -R tomcat:tomcat /opt/tomcat11/MyPokedexBackup/springboot/*
            sudo chmod 755 /opt/tomcat11/MyPokedex/springboot.war

            # Start Tomcat 11 Service
            sudo systemctl start tomcat11
            timeout 120 bash -c 'until sudo systemctl is-active --quiet tomcat11; do sleep 3; done'
            sudo journalctl -u tomcat11 -n 100 --no-pager

            # Generate new Swagger
            cd /opt/tomcat11/MyPokedex/springboot
            sudo ./mvnw springdoc-openapi:generate
